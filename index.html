    <body>
      <div id="upgrade"><i class="fas fa-flag"></i>Bling <span></span> has been installed, click <a href="#">Reload</a> You can <a href="https://github.com/lurume84/bling-viewer/releases" target="_blank">read more</a> about changes in this release.</div>
      <div id="draggable-window"></div>
      <div class="layout">
        <div class="drawer">
          <nav class="navigation"></nav>
		  <div id="version">
			<div class="viewer"><div class="title">viewer</div><div class="number" title="git commit"></div></div>
		  </div>
        </div>
        <div class="content"></div>
      </div>
      <dialog id="login" class="mdl-dialog">
        <h4 class="mdl-dialog__title"><img src="img/logo_white.png"/></h4>
        <form class="login" action="#">
          <div class="mdl-dialog__content">
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
              <input class="mdl-textfield__input user" type="text" id="userInput"/>
              <label class="mdl-textfield__label" for="userInput">Username...</label>
            </div>
            <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input class="mdl-textfield__input password" type="password" id="passwordInput"/>
                <label class="mdl-textfield__label" for="passwordInput">Password...</label>
            </div>
          </div>
          <div class="mdl-dialog__actions">
            <button type="submit" class="mdl-button submit">Login</button>
          </div>
          <div class="progress mdl-progress mdl-js-progress mdl-progress__indeterminate"></div>
        </form>
		<form class="verify" action="#">
          <div class="mdl-dialog__content">
			A verification code has been sent to <span class="email"></span>
			<div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                <input class="mdl-textfield__input verification" id="verificationInput"/>
                <label class="mdl-textfield__label" for="verificationInput">Verification...</label>
            </div>
            <label class="mdl-checkbox mdl-js-checkbox mdl-js-ripple-effect" for="rememberInput"
                   title="Saves Blink's login cookies in ~/.config/bling-viewer so the next login can skip this step">
              <input type="checkbox" id="rememberInput" class="mdl-checkbox__input remember"/>
              <span class="mdl-checkbox__label">Don't ask again on this computer</span>
            </label>
          </div>
          <div class="mdl-dialog__actions">
            <button type="submit" class="mdl-button submit">Verify</button>
          </div>
          <div class="progress mdl-progress mdl-js-progress mdl-progress__indeterminate"></div>
        </form>
      </dialog>
      <div id="toast" class="mdl-js-snackbar mdl-snackbar">
          <i class="fas fa-exclamation-triangle"></i>
          <div class="mdl-snackbar__text"></div>
          <button class="mdl-snackbar__action" type="button"></button>
        </div>
    </body>
    <script>
        // When served by bling-proxy.py, route cross-origin requests through it
        // ("<dir>/https://host/path") so CORS is handled without --disable-web-security.
        // The proxy's own URLs are relative to the page too, so the viewer works both at
        // the root (bling.sh) and under a path such as /blink/ behind a reverse proxy.
        var proxyBase = location.pathname.replace(/[^\/]*$/, "");
        $.ajaxPrefilter(function( options, originalOptions, jqXHR ){
            if (/^https?:$/.test(location.protocol) && /^https?:\/\//.test(options.url)
                && options.url.indexOf(location.origin + "/") !== 0) {
                options.url = proxyBase + options.url;
                // Blink's token goes to the proxy as X-Blink-Authorization, leaving
                // Authorization free for basic auth on a reverse proxy in front of it.
                var set = jqXHR.setRequestHeader;
                jqXHR.setRequestHeader = function(name, value) {
                    return set.call(this, /^authorization$/i.test(name) ? "X-Blink-Authorization" : name, value);
                };
            }
        });
    
        // Short git commit id of the viewer, from bling-proxy.py
        $.get("version", function(v){ $("#version .number").text(v); });

        var server = "immedia-semi.com";
        var credentials = {region: "", token: ""};
        // camera id -> {type: Blink product type ("catalina", "owl", ...), serial}, filled from homescreen
        var cameraInfo = $.Deferred();
        // the full homescreen response (sync_modules etc.), {} if it failed
        var homescreenData = $.Deferred();

        var g_user;
        
        var initializeConfig = initializeConfig || [];
        initializeConfig.push("login");
        initializeConfig.push("board");
        initializeConfig.push("camera");

        (function()
        {
            new blink.helpers.Initializer();
        })();
    </script>
</html>
